defaults:
  - ppo_trainer
  - user
  - _self_

# Official training context:
# MAX_PROMPT_LENGTH=8192
# MAX_RESPONSE_LENGTH=1024
# MAX_MODEL_LEN=$((MAX_PROMPT_LENGTH + MAX_RESPONSE_LENGTH))
max_model_len: 9216

actor_rollout_ref:
  actor:
    ppo_mini_batch_size: 32 # TODO: make slightly off-policy in the future; use same as baseline; perhaps make 1 again for fastest convergence
    policy_loss:
      loss_mode: vopd
    self_distillation:
      max_reprompt_len: 10240
      is_clip: 2.0
    optim:
      lr: 1e-5
  rollout:
    n: 8
    calculate_log_probs: True

algorithm:
  noisy_rollout:
    enabled: False
    noisy_count: 8
    all_noisy_from_epoch: null
    skip_old_log_prob: False
    initial_scale: 0.5
    anneal_steps: null # Defaults to the training horizon; set explicitly for shorter ablations.
    preserve_evidence: False
  adv_estimator: grpo # disables critic
  norm_adv_by_std_in_grpo: False
  rollout_correction:
    rollout_is: token
    rollout_is_threshold: 2.0

data:
  train_batch_size: 32

trainer:
  epoch_mastery:
    enabled: False
    rollout_n: 8
  val_before_train: False
